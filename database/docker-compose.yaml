version: '3.8'

services:
  custom_postgres_server:
    image: postgres:latest
    container_name: force-aligner-multiling-server
    environment:
      POSTGRES_USER: lucdenardi
      POSTGRES_PASSWORD: my_secret_password
      POSTGRES_DB: forced-aligner-proj
    ports:
      - "5432:5433" # Maps port 5433 on your Mac to port 5432 in the container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
